<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Album — Horizon Inn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .album-header {
    padding: 120px 0 60px;
    background-color: var(--pine-deep);
    color: var(--ivory);
    text-align: center;
  }
  .album-gallery {
    padding: 60px 0;
    background-color: #fdfbf7;
  }
  .album-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }
  .album-item {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    aspect-ratio: 4 / 3;
  }
  .album-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .album-item:hover img {
    transform: scale(1.05);
  }
</style>
</head>
<body>

<header class="site-nav" id="siteNav" style="background-color: rgba(16, 37, 31, 0.9);">
  <div class="nav-inner container">
    <a href="index.html" class="brand">
      <img src="images/logo1.png" alt="Horizon Inn Logo" style="height: 60px; width: auto; object-fit: contain;">
      <span class="brand-text text-white">Horizon <em>Inn</em></span>
    </a>
    <nav class="nav-links d-none d-lg-flex" aria-label="Primary">
      <a href="index.html" style="color: white;">Home</a>
    </nav>
  </div>
</header>

<section class="album-header">
  <div class="container">
    <h1 style="font-family: 'Fraunces', serif;">Our Photo Album</h1>
    <p class="lead">A collection of moments and views from Horizon Inn.</p>
  </div>
</section>

<section class="album-gallery">
  <div class="container">
    <div class="album-grid">
      <div class="album-item"><img src="images/view1.jpg" alt="View 1"></div>
      <div class="album-item"><img src="images/view2.jpg" alt="View 2"></div>
      <div class="album-item"><img src="images/view3.jpg" alt="View 3"></div>
      <div class="album-item"><img src="images/view4.jpg" alt="View 4"></div>
      <div class="album-item"><img src="images/view6.jpg" alt="View 6"></div>
      <div class="album-item"><img src="images/hotalview1.jpeg" alt="Hotel View 1"></div>
      <div class="album-item"><img src="images/hotalview2.jpeg" alt="Hotel View 2"></div>
      <div class="album-item"><img src="images/main.jpg" alt="Main View"></div>
      <div class="album-item"><img src="images/rooms1.jpeg" alt="Room 1"></div>
      <div class="album-item"><img src="images/room2.jpeg" alt="Room 2"></div>
      <div class="album-item"><img src="images/camping.webp" alt="Camping"></div>
    </div>
  </div>
</section>

</body>
</html>
